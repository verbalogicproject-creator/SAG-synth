<script>
        // Sync piano roll scrolling
        const grid = document.getElementById('grid-container');
        const keys = document.getElementById('piano-keys');

        grid.addEventListener('scroll', () => {
            keys.scrollTop = grid.scrollTop;
        });

        // Simple Note Toggling simulation
        grid.addEventListener('click', (e) => {
            if (e.target.classList.contains('piano-roll-grid')) {
                const rect = grid.getBoundingClientRect();
                const x = e.clientX - rect.left + grid.scrollLeft;
                const y = e.clientY - rect.top + grid.scrollTop;
                
                // Snap to grid (40px x 24px)
                const gridX = Math.floor(x / 40) * 40;
                const gridY = Math.floor(y / 24) * 24;

                const note = document.createElement('div');
                note.className = 'absolute bg-primary-fixed-dim/80 border border-primary rounded-sm note-active';
                note.style.left = `${gridX}px`;
                note.style.top = `${gridY}px`;
                note.style.width = '40px';
                note.style.height = '24px';
                
                note.onclick = (event) => {
                    event.stopPropagation();
                    note.remove();
                };

                grid.appendChild(note);
            }
        });

        // Horizontal scroll with touch swipe logic (standard mobile behavior)
    </script>
