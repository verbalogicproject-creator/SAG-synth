<script>
        function triggerPad(el) {
            // Remove active from others
            document.querySelectorAll('.pad-active').forEach(p => {
                p.classList.remove('pad-active', 'bg-surface-container-highest');
                p.classList.add('bg-surface-container-high');
                const label = p.querySelector('.font-module-header');
                const pId = p.querySelector('.font-label-caps');
                if (label) label.classList.replace('text-primary-fixed-dim', 'text-on-surface-variant');
                if (pId) pId.classList.replace('text-primary-fixed-dim', 'text-outline');
                const glow = p.querySelector('.bg-primary/5');
                if (glow) glow.remove();
            });

            // Set active
            el.classList.add('pad-active', 'bg-surface-container-highest');
            el.classList.remove('bg-surface-container-high');
            
            const label = el.querySelector('.font-module-header');
            const pId = el.querySelector('.font-label-caps');
            if (label) label.classList.replace('text-on-surface-variant', 'text-primary-fixed-dim');
            if (pId) pId.classList.replace('text-outline', 'text-primary-fixed-dim');
            
            if (!el.querySelector('.bg-primary/5')) {
                const glowDiv = document.createElement('div');
                glowDiv.className = 'absolute inset-0 bg-primary/5';
                el.appendChild(glowDiv);
            }

            // Haptic/Visual feedback
            el.style.transform = 'scale(0.95)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
            }, 50);

            // Update Header
            const padName = label.innerText;
            document.querySelector('.text-secondary-fixed-dim').innerText = padName;
        }

        // Initialize prevent scrolling
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
