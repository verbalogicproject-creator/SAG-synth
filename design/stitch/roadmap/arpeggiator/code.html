<script>
        function toggleArp(btn) {
            const led = document.getElementById('arp-power-led');
            const text = document.getElementById('arp-power-text');
            const isActive = btn.classList.contains('active-glow');
            
            if (!isActive) {
                btn.classList.add('active-glow', 'border-primary-fixed-dim/30');
                led.classList.remove('bg-outline');
                led.classList.add('bg-primary-fixed-dim', 'shadow-[0_0_12px_#00dbe9]');
                text.innerText = 'ON';
                text.classList.remove('text-outline');
                text.classList.add('text-primary-fixed-dim', 'active-glow-text');
            } else {
                btn.classList.remove('active-glow', 'border-primary-fixed-dim/30');
                led.classList.add('bg-outline');
                led.classList.remove('bg-primary-fixed-dim', 'shadow-[0_0_12px_#00dbe9]');
                text.innerText = 'OFF';
                text.classList.add('text-outline');
                text.classList.remove('text-primary-fixed-dim', 'active-glow-text');
            }
        }

        // Mode selector logic
        const modeBtns = document.querySelectorAll('.mode-btn');
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => {
                    b.classList.remove('active', 'bg-on-primary-fixed-variant', 'text-primary-fixed-dim', 'active-glow');
                    b.classList.add('bg-surface-container-highest', 'text-outline');
                });
                btn.classList.add('active', 'bg-on-primary-fixed-variant', 'text-primary-fixed-dim', 'active-glow');
                btn.classList.remove('bg-surface-container-highest', 'text-outline');
            });
        });
    </script>
