<style>
        body {
            background-color: #131315;
            color: #e5e1e4;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .step-button.active {
            box-shadow: 0 0 12px 2px rgba(0, 219, 233, 0.4);
        }

        .step-button.playing {
            border-color: #00dbe9;
            transform: scale(1.05);
        }

        .well-inset {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            border: 1px solid #3b494b;
        }

        .knob-track {
            background: conic-gradient(from 180deg, #00dbe9 var(--value), #3b494b 0);
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #3b494b;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 8px;
            background: #00dbe9;
            margin-top: -6px;
            border-radius: 1px;
            box-shadow: 0 0 8px rgba(0, 219, 233, 0.6);
        }

        .vertical-slider {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 80px;
        }
        
        .grid-subtle {
            background-image: radial-gradient(#ffffff08 1px, transparent 1px);
            background-size: 20px 20px;
        }

<style>
    body {

<body class="font-body-sm text-body-sm">
<!-- Top Navigation Shell -->
<header class="bg-surface text-primary-fixed-dim font-module-header text-module-header uppercase tracking-widest border-b border-outline-variant flex justify-between items-center px-module-padding h-12 w-full z-50">

<span class="text-primary-fixed-dim border-b-2 border-primary-fixed-dim px-2 py-1">SEQ</span>

</nav>

</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-hidden p-unit grid grid-cols-1 md:grid-cols-12 gap-gutter relative grid-subtle">
<!-- Left Global Controls Panel -->
<section class="md:col-span-3 lg:col-span-2 bg-surface-container-low border border-outline-variant rounded-lg p-module-padding flex flex-col gap-6">
<div class="flex items-center justify-between">
<h2 class="font-module-header text-module-header uppercase text-primary-fixed-dim">Transport</h2>
<div class="flex gap-2">
<button class="w-8 h-8 flex items-center justify-center bg-on-primary-fixed-variant rounded text-primary-fixed-dim hover:bg-primary-container hover:text-on-primary-container transition-colors" id="playBtn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-8 h-8 flex items-center justify-center bg-surface-container-highest border border-outline-variant rounded text-on-surface-variant" id="stopBtn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
</div>
</div>
<!-- Tempo Control -->
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-outline uppercase">Tempo (BPM)</label>
<div class="flex items-center gap-4">
<div class="relative w-16 h-16 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface-dim well-inset">
<div class="absolute inset-1 rounded-full knob-track" style="--value: 45%;"></div>
<div class="absolute inset-2 rounded-full bg-surface-container shadow-inner"></div>
<div class="w-1 h-4 bg-primary-fixed-dim absolute top-2 rounded-full origin-bottom rotate-45"></div>
</div>
<div class="bg-surface-container-lowest border border-outline-variant px-3 py-1 rounded">
<span class="font-readout-lg text-readout-lg text-primary-fixed-dim">120.0</span>
</div>
</div>
</div>
<!-- Swing & Length -->
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-outline uppercase">Swing</label>
<div class="h-24 bg-surface-container-lowest rounded well-inset p-2 flex flex-col items-center justify-end">
<input class="vertical-slider w-1 h-16 accent-primary-fixed-dim" orient="vertical" type="range" value="15"/>
<span class="mt-1 font-label-caps text-primary-fixed-dim">15%</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-outline uppercase">Length</label>
<div class="h-24 bg-surface-container-lowest rounded well-inset p-2 flex flex-col items-center justify-between">
<div class="flex flex-col gap-1 w-full">
<button class="w-full text-center py-1 bg-surface-container-highest rounded text-[10px] text-on-surface">16</button>
<button class="w-full text-center py-1 bg-surface-dim border border-outline-variant rounded text-[10px] text-outline">32</button>
<button class="w-full text-center py-1 bg-surface-dim border border-outline-variant rounded text-[10px] text-outline">64</button>
</div>
</div>
</div>
</div>
<div class="mt-auto">
<div class="p-2 border border-outline-variant rounded bg-surface-dim">

</div>

</div>
</div>
</div>

<!-- Center Sequencer Module -->
<section class="md:col-span-9 lg:col-span-10 flex flex-col gap-gutter">
<!-- Visualizer / Oscilloscope -->
<div class="h-32 bg-surface-container-lowest border border-outline-variant rounded-lg relative overflow-hidden flex items-center justify-center">
<div class="absolute inset-0 opacity-10 bg-[linear-gradient(90deg,rgba(255,255,255,0.1)_1px,transparent_1px),linear-gradient(rgba(255,255,255,0.1)_1px,transparent_1px)] bg-[size:40px_40px]"></div>
<svg class="w-full h-full" viewbox="0 0 1000 100">
<path class="opacity-80" d="M 0 50 Q 50 10, 100 50 T 200 50 T 300 50 T 400 50 T 500 50 T 600 50 T 700 50 T 800 50 T 900 50 T 1000 50" fill="none" stroke="#00dbe9" stroke-width="1.5">
<animate attributename="d" dur="2s" repeatcount="indefinite" values="M 0 50 Q 50 10, 100 50 T 200 50 T 300 50 T 400 50 T 500 50 T 600 50 T 700 50 T 800 50 T 900 50 T 1000 50; M 0 50 Q 50 90, 100 50 T 200 50 T 300 50 T 400 50 T 500 50 T 600 50 T 700 50 T 800 50 T 900 50 T 1000 50; M 0 50 Q 50 10, 100 50 T 200 50 T 300 50 T 400 50 T 500 50 T 600 50 T 700 50 T 800 50 T 900 50 T 1000 50"></animate>
</path>
</svg>
<div class="absolute top-2 left-3 font-label-caps text-primary-fixed-dim bg-on-primary-fixed-variant px-2 rounded">MASTER OUT</div>
</div>
<!-- 16-Step Grid -->
<div class="flex-1 bg-surface-container-low border border-outline-variant rounded-lg p-module-padding flex flex-col gap-8">
<!-- Steps & Velocity -->
<div class="grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-16 gap-3">
<!-- JS will populate these buttons -->
<script>
                        const createSequencer = () => {
                            const grid = document.querySelector('.lg\\:grid-cols-16');
                            for (let i = 1; i <= 16; i++) {
                                const stepContainer = document.createElement('div');
                                stepContainer.className = 'flex flex-col items-center gap-4';
                                
                                const stepBtn = document.createElement('button');
                                stepBtn.className = `step-button w-full aspect-square rounded-lg border-2 border-outline-variant transition-all duration-150 flex items-center justify-center font-label-caps ${i % 4 === 1 ? 'bg-surface-container-high' : 'bg-surface-dim'}`;
                                stepBtn.innerHTML = i;
                                stepBtn.onclick = () => stepBtn.classList.toggle('active');
                                stepBtn.onclick = () => {
                                    if (stepBtn.dataset.active === 'true') {
                                        stepBtn.dataset.active = 'false';
                                        stepBtn.classList.remove('bg-primary-fixed-dim', 'text-on-primary-fixed', 'active');
                                        stepBtn.classList.add('text-on-surface-variant');
                                    } else {
                                        stepBtn.dataset.active = 'true';
                                        stepBtn.classList.add('bg-primary-fixed-dim', 'text-on-primary-fixed', 'active');
                                        stepBtn.classList.remove('text-on-surface-variant');
                                    }
                                };
                                
                                const velTrack = document.createElement('div');
                                velTrack.className = 'w-4 h-32 bg-surface-container-lowest well-inset rounded-full relative flex flex-col justify-end p-0.5 overflow-hidden';
                                
                                const velFill = document.createElement('div');
                                velFill.className = 'bg-primary-fixed-dim opacity-40 w-full rounded-full transition-all duration-100';
                                velFill.style.height = `${40 + Math.random() * 50}%`;
                                
                                const velHandle = document.createElement('input');
                                velHandle.type = 'range';
                                velHandle.orient = 'vertical';
                                velHandle.className = 'absolute inset-0 w-full h-full opacity-0 cursor-ns-resize';
                                velHandle.oninput = (e) => {
                                    velFill.style.height = `${e.target.value}%`;
                                    velFill.style.opacity = e.target.value > 0 ? (0.3 + (e.target.value/100)*0.7) : 0.1;
                                };

                                velTrack.appendChild(velFill);
                                velTrack.appendChild(velHandle);
                                
                                stepContainer.appendChild(velTrack);
                                stepContainer.appendChild(stepBtn);
                                grid.appendChild(stepContainer);
                            }
                        };
                        window.onload = createSequencer;
                    </script>
</div>
<!-- Footer Module Actions -->
<div class="mt-auto border-t border-outline-variant pt-6 flex flex-wrap items-center justify-between gap-4">

<footer class="md:hidden bg-surface-container-lowest border-t border-outline-variant fixed bottom-0 w-full z-50 flex justify-around items-center h-16">
<div class="flex flex-col items-center justify-center text-outline hover:text-primary">
<span class="material-symbols-outlined">graphic_eq</span>
<span class="font-label-caps text-label-caps">OSC</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-caps text-label-caps">ADSR</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary">
<span class="material-symbols-outlined">filter_list</span>
<span class="font-label-caps text-label-caps">FILTER</span>
</div>
<div class="flex flex-col items-center justify-center text-primary-fixed-dim bg-on-primary-fixed-variant rounded-full px-4 py-1">
<span class="material-symbols-outlined">reorder</span>
<span class="font-label-caps text-label-caps">SEQ</span>
</div>
<div class="flex flex-col items-center justify-center text-outline hover:text-primary">
<span class="material-symbols-outlined">blur_on</span>
<span class="font-label-caps text-label-caps">FX</span>
</div>
</footer>
<script>
        // Simple playhead animation
        let currentStep = 0;
        let isPlaying = false;
        let interval;

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');

        const stepThrough = () => {
            const steps = document.querySelectorAll('.step-button');
            steps.forEach((s, idx) => {
                s.classList.toggle('playing', idx === currentStep);
            });
            currentStep = (currentStep + 1) % 16;
        };

        playBtn.onclick = () => {
            if (isPlaying) {
                clearInterval(interval);
                isPlaying = false;
                playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span>';
            } else {
                interval = setInterval(stepThrough, 125); // 120bpm approx
                isPlaying = true;
                playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span>';
            }
        };

        stopBtn.onclick = () => {
            clearInterval(interval);
            isPlaying = false;
            currentStep = 0;
            playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span>';
            const steps = document.querySelectorAll('.step-button');
            steps.forEach(s => s.classList.remove('playing'));
        };
    </script>
