<script>
        // Simple Interaction logic
        const steps = document.querySelectorAll('.grid > div[class*="rounded-sm"]');
        steps.forEach(step => {
            step.addEventListener('click', () => {
                if (step.classList.contains('bg-surface-container-highest')) {
                    // Turn on
                    step.classList.remove('bg-surface-container-highest', 'border', 'border-outline-variant/30');
                    step.classList.add('bg-primary-fixed-dim', 'step-active');
                } else if (step.classList.contains('bg-primary-fixed-dim')) {
                    // Turn off
                    step.classList.add('bg-surface-container-highest', 'border', 'border-outline-variant/30');
                    step.classList.remove('bg-primary-fixed-dim', 'step-active');
                } else if (step.classList.contains('bg-secondary-container')) {
                    step.classList.add('bg-surface-container-highest', 'border', 'border-outline-variant/30');
                    step.classList.remove('bg-secondary-container', 'step-active');
                } else if (step.classList.contains('bg-tertiary-fixed-dim')) {
                    step.classList.add('bg-surface-container-highest', 'border', 'border-outline-variant/30');
                    step.classList.remove('bg-tertiary-fixed-dim', 'step-active');
                }
            });
        });

        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('span');
            if (isPlaying) {
                icon.innerText = 'pause';
                icon.setAttribute('data-icon', 'pause');
                playBtn.classList.add('ring-2', 'ring-primary/40');
            } else {
                icon.innerText = 'play_arrow';
                icon.setAttribute('data-icon', 'play_arrow');
                playBtn.classList.remove('ring-2', 'ring-primary/40');
            }
        });
    </script>
