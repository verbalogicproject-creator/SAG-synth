<script>
    // Knob Interaction
    const knobs = document.querySelectorAll('.knob-container');
    knobs.forEach(knob => {
        knob.addEventListener('mousedown', (e) => {
            const valElem = knob.querySelector('.knob-value');
            const indicator = knob.querySelector('.knob-indicator');
            let startY = e.clientY;
            const currentRotStr = valElem.style.transform.match(/rotate\((.*)deg\)/);
            let currentRot = currentRotStr ? parseInt(currentRotStr[1]) : 0;

            const handleMove = (moveEvent) => {
                const delta = startY - moveEvent.clientY;
                const newRot = (currentRot + delta) % 360;
                valElem.style.transform = `rotate(${newRot}deg)`;
                if (indicator) {
                    indicator.style.transform = `rotate(${newRot}deg) translateX(-50%)`;
                }
            };

            const handleUp = () => {
                document.removeEventListener('mousemove', handleMove);
                document.removeEventListener('mouseup', handleUp);
            };

            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleUp);
        });
        
        // Simple click to increment as fallback
        knob.addEventListener('dblclick', () => {
            const valElem = knob.querySelector('.knob-value');
            const indicator = knob.querySelector('.knob-indicator');
            const currentRot = parseInt(valElem.style.transform.replace('rotate(', '').replace('deg)', '')) || 0;
            const nextRot = (currentRot + 30) % 360;
            valElem.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
            valElem.style.transform = `rotate(${nextRot}deg)`;
            if (indicator) {
                indicator.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1)';
                indicator.style.transform = `rotate(${nextRot}deg) translateX(-50%)`;
            }
            setTimeout(() => {
                valElem.style.transition = 'none';
                if(indicator) indicator.style.transition = 'none';
            }, 200);
        });
    });

    // Keyboard Feedback
    const whiteKeys = document.querySelectorAll('.piano-key-white');
    const blackKeys = document.querySelectorAll('.piano-key-black');
    
    whiteKeys.forEach(k => {
        k.addEventListener('mousedown', () => {
            k.style.background = '#00dbe9';
            k.style.boxShadow = '0 0 20px rgba(0,219,233,0.6), inset 0 2px 8px rgba(0,0,0,0.2)';
        });
        k.addEventListener('mouseup', () => {
            k.style.background = '';
            k.style.boxShadow = '';
        });
        k.addEventListener('mouseleave', () => {
            k.style.background = '';
            k.style.boxShadow = '';
        });
    });

    blackKeys.forEach(k => {
        k.addEventListener('mousedown', () => {
            k.style.background = '#006970';
            k.style.boxShadow = '0 0 15px rgba(0,105,112,0.6)';
        });
        k.addEventListener('mouseup', () => {
            k.style.background = '';
            k.style.boxShadow = '';
        });
        k.addEventListener('mouseleave', () => {
            k.style.background = '';
            k.style.boxShadow = '';
        });
    });
</script>
</body></html>
